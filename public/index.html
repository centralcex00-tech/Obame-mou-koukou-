<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBAME MOUÉKOUKOU</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: white;
    }

    header {
      padding: 22px;
      text-align: center;
      background: #102b4c;
      border-bottom: 1px solid #285078;
    }

    header h1 {
      margin: 0;
      color: #64c8ff;
      font-size: 25px;
    }

    header p {
      color: #b8cce0;
      font-size: 13px;
    }

    main {
      max-width: 750px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      padding: 25px 10px;
    }

    .welcome h2 {
      color: #64c8ff;
    }

    .chat {
      background: #10243b;
      border: 1px solid #244563;
      border-radius: 15px;
      padding: 15px;
    }

    #messages {
      height: 350px;
      overflow-y: auto;
      padding: 10px;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user {
      background: #15558a;
      margin-left: 30px;
    }

    .ai {
      background: #1b354d;
      margin-right: 30px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #42617e;
      background: #071426;
      color: white;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #168bd0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #829bb2;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>OBAME MOUÉKOUKOU</h1>
  <p>L'union des intelligences artificielles</p>
</header>

<main>
  <section class="welcome">
    <h2>Bienvenue !</h2>
    <p>Une nouvelle génération d'intelligence artificielle.</p>
    <p>Pose tes questions et commence une conversation.</p>
  </section>

  <section class="chat">
    <div id="messages">
      <div class="message ai">
        Bonjour ! Je suis OBAME MOUÉKOUKOU.
        Comment puis-je t'aider ?
      </div>
    </div>

    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="Écris ton message..."
      >
      <button id="send" onclick="sendMessage()">Envoyer</button>
      <button onclick="speakLast()">🔊</button>
    </div>
  </section>
</main>

<footer>
  OBAME MOUÉKOUKOU © 2026
</footer>

<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("message");
  let lastReply = "";

  async function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    const button = document.getElementById("send");
    button.disabled = true;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Erreur du serveur");
      }

      lastReply = data.reply;
      addMessage(lastReply, "ai");

    } catch (error) {
      addMessage("Impossible de contacter l'IA. Vérifie la configuration du serveur.", "ai");
    } finally {
      button.disabled = false;
    }
  }

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function speakLast() {
    if (!lastReply || !("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(lastReply);
    speech.lang = "fr-FR";
    speechSynthesis.speak(speech);
  }

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
