<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBAME MOUÉKOUKOU</title>
  <style>
    * {
      box-sizing: border-box;
    }body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #071525;
  color: white;
}

header {
  padding: 25px 15px;
  text-align: center;
  background: #102c49;
  border-bottom: 2px solid #38bdf8;
}

header h1 {
  color: #38bdf8;
  font-size: 25px;
}

header p {
  color: #d1e8ff;
}

main {
  max-width: 650px;
  margin: 30px auto;
  padding: 15px;
}

.welcome {
  text-align: center;
  padding: 25px;
  background: #102c49;
  border-radius: 15px;
}

.welcome h2 {
  color: #38bdf8;
}

.chat {
  margin-top: 20px;
  background: #102c49;
  padding: 18px;
  border-radius: 15px;
}

#messages {
  min-height: 180px;
  max-height: 350px;
  overflow-y: auto;
  padding: 10px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #1d4265;
  overflow-wrap: anywhere;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #0284c7;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  background: #0369a1;
}

footer {
  text-align: center;
  padding: 25px;
  color: #9dbbd5;
}

  </style>
</head><body><header>
  <h1>OBAME MOUÉKOUKOU</h1>
  <p>L'union des intelligences artificielles</p>
</header><main>  <section class="welcome">
    <h2>Bienvenue !</h2>
    <p>Une nouvelle génération d'intelligence artificielle.</p>
    <p>Réfléchir ensemble. Apprendre ensemble. Aller plus loin.</p>
  </section>  <section class="chat">
    <h2>💬 Notre espace de discussion</h2><div id="messages">
  <div class="message">
    Bonjour ! Je suis OBAME MOUÉKOUKOU.
    Comment puis-je t'aider ?
  </div>
</div>

<input
  type="text"
  id="question"
  placeholder="Écris ton message ici..."
>

<button onclick="envoyerMessage()">
  Envoyer
</button>

  </section></main><footer>
  OBAME MOUÉKOUKOU © 2026
</footer><script>
  function envoyerMessage() {
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    const texte = input.value.trim();

    if (texte === "") return;

    const message = document.createElement("div");
    message.className = "message";
    message.textContent = "Toi : " + texte;

    messages.appendChild(message);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
  }
</script></body>
</html>
